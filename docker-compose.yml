services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-forge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-forgeshelf}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-forge} -d ${POSTGRES_DB:-forgeshelf}']
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build:
      context: .
      args:
        INSTALL_TOOLS: ${INSTALL_TOOLS:-true}
    image: ${IMAGE:-forge-shelf:local}
    restart: unless-stopped
    command: ['web']
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      APP_SECRET: ${APP_SECRET:?set APP_SECRET in .env}
      STORAGE_DIR: /data
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-2048}
      ALLOW_DATA_LOSS: ${ALLOW_DATA_LOSS:-false}
      UVTOOLS_BIN: ${UVTOOLS_BIN:-/opt/uvtools/usr/bin/UVtoolsCmd}
      HOST_DATA_DIR: ${HOST_DATA_DIR:-}
      PLUGINS_DIR: ${PLUGINS_DIR:-/data/plugins}
      SDCP_BROADCAST: ${SDCP_BROADCAST:-255.255.255.255}
    ports:
      - '${APP_PORT:-8770}:3000'
    volumes:
      - ./data:/data

  worker:
    build:
      context: .
      args:
        INSTALL_TOOLS: ${INSTALL_TOOLS:-true}
    image: ${IMAGE:-forge-shelf:local}
    restart: unless-stopped
    command: ['worker']
    depends_on:
      db:
        condition: service_healthy
      web:
        condition: service_started
    environment:
      DATABASE_URL: ${DATABASE_URL}
      APP_SECRET: ${APP_SECRET:?set APP_SECRET in .env}
      STORAGE_DIR: /data
      UVTOOLS_BIN: ${UVTOOLS_BIN:-/opt/uvtools/usr/bin/UVtoolsCmd}
      HOST_DATA_DIR: ${HOST_DATA_DIR:-}
      PLUGINS_DIR: ${PLUGINS_DIR:-/data/plugins}
      WORKER_POLL_MS: ${WORKER_POLL_MS:-3000}
      PRINTER_POLL_MS: ${PRINTER_POLL_MS:-10000}
      SDCP_BROADCAST: ${SDCP_BROADCAST:-255.255.255.255}
    volumes:
      - ./data:/data

volumes:
  pgdata:
