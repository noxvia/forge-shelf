name: Publish image

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

# Two pushes in quick succession would otherwise run two ~2.5 GB builds in
# parallel, and the loser's tags get overwritten by the winner anyway. Keep only
# the newest per branch. Tag builds get their own group so a release is never
# cancelled by a subsequent push to main.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Full image: includes OrcaSlicer, PrusaSlicer and UVtools.
  #
  # amd64 only, and not by choice — all three ship as x86_64 AppImages, so there
  # is nothing to install on arm64. Pi and Apple Silicon hosts want the `slim`
  # tag below.
  # ---------------------------------------------------------------------------
  full:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # The slicer layer is ~2 GB and the runner only has ~14 GB free. Reclaim
      # the preinstalled toolchains we don't use before building.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h /

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: INSTALL_SLICERS=true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # mode=min keeps the layer cache well inside the 10 GB per-repo limit;
          # mode=max would evict itself on every run at this image size.
          cache-from: type=gha,scope=full
          cache-to: type=gha,mode=min,scope=full

  # ---------------------------------------------------------------------------
  # Slim image: no slicer toolchain. Catalogues files and sends pre-sliced ones,
  # about a tenth the size, and builds for arm64 as well.
  # ---------------------------------------------------------------------------
  slim:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=raw,value=slim,enable={{is_default_branch}}
            type=semver,pattern={{version}},suffix=-slim
            type=sha,format=short,suffix=-slim

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: INSTALL_SLICERS=false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=slim
          cache-to: type=gha,mode=max,scope=slim
