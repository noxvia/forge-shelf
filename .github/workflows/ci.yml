name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npx next build
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          APP_SECRET: ci-only-not-a-real-secret

  docker:
    runs-on: ubuntu-latest
    # The slicer layer pulls ~1 GB of AppImages; only pay for it on main.
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          # Skip the slicer download in CI — it verifies the app layers build,
          # which is what breaks. The release URLs are checked at deploy time.
          build-args: INSTALL_SLICERS=false
          cache-from: type=gha
          cache-to: type=gha,mode=max
