name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npx next build
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          APP_SECRET: ci-only-not-a-real-secret

  # Pull requests get an image build too, so a broken Dockerfile is caught before
  # merge. On main this is skipped — release.yml builds and publishes for real.
  docker:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          # Skip the slicer download here — this checks that the app layers
          # build, which is what actually breaks in a PR.
          build-args: INSTALL_SLICERS=false
          cache-from: type=gha,scope=slim
